experiment_dir: /fs/site7/eccc/crd/cccma/users/rpg002/output/cccma_PPP_tests/train_forecast_reference
max_epochs: 1
train_loader:
  dataset:
    forecast:
      paths: /space/hall7/sitestore/eccc/crd/cccma/users/rpg002/data/tas/forecast_data/datetime
      names:
      - tas
      preprocessing_pipeline:
        preprocessors_list:
        - name: anomalies
          args:
            dims:
            - time
      ensemble_mean: true
      concat_dim: time
      rename_dict:
        year: time
      drop_vars_list:
      - height
    reference:
      paths: /space/hall7/sitestore/eccc/crd/cccma/users/rpg002/data/tas/observations/ERA5/datetime
      names:
      - tas
      preprocessing_pipeline:
        preprocessors_list:
        - name: anomalies
          args:
            dims:
            - time
            frequency: month
      concat_dim: time
    lead_times:
      start: 1
      end: 12
  batch_size: 10
  time_features:
  - time
  - lead_time
  - month_sin
  - month_cos
  train_years_slice:
  - 1980
  - 1981
  num_validation_years: 0
  prefetch_factor: 4
  num_data_workers: 0
  share_spatial_mask: true
  load: true
module:
  type: deterministic
  config:
    Architecture:
      type: UNet
      config:
        channels:
        - 16
        - 32
        - 64
        - 128
        - 256
        block_config:
          name: convnext
          num_blocks: 2
        output_block_hidden_channels: 32
losspipeline:
  loss_pipeline:
  - name: mse
  reduction: mean
trainer:
  beta_finder:
    beta: 10
    num_epoch_to_warmup: 10
  earlystoppingbuffer: 10
  mixed_precision: true
optimization:
  lr: 0.0001
  optimizer_type: adam
  lr_scheduler_config:
    min_lr: 1.0e-05
    warmup_epochs: 1
    total_epochs: 10
    hold_min_lr: true
weights:
  spatial_method: uniform
log_every_n_epochs: 2
save_checkpoint: true
seed: 10