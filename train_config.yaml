experiment_dir: /space/hall7/sitestore/eccc/crd/cccma/users/rpg002/output/cccma_PPP_tests/test_for_Reinel
max_epochs: 100
train_loader:
  dataset_config:
    model:
      paths: /space/hall7/sitestore/eccc/crd/cccma/users/rpg002/data/tas/observations/ERA5/datetime/forecast_like
      names:
      - tas
      preprocessing_pipeline:
        preprocessors_list:
        - name: standardizer
          args:
            dims:
            - time
            frequency: month
        - name: flattener 
      ensemble_mean: false
      # concat_dim: time
      # rename_dict:
      #   year: time
      # drop_vars_list: [height]
    # observation:
    #   paths: /space/hall7/sitestore/eccc/crd/cccma/users/rpg002/data/tas/observations/ERA5/datetime
    #   names:
    #   - tas
    #   preprocessing_pipeline:
    #     preprocessors_list:
    #     - name: anomalies
    #       args:
    #         dims:
    #         - time
    #         frequency: month
    #     - name: flattener
    #   concat_dim: time
    condition_method: same_member 
    lead_times:
      start: 1
      end: 1
    # condition:
    #   paths: /space/hall7/sitestore/eccc/crd/cccma/users/rpg002/data/tas/dummy_mask
    #   names:
    #     - tas
    #   preprocessing_pipeline:
    #     preprocessors_list:
    #     - name: flattener
  batch_size: 100
  # time_features:
  # - time
  # - lead_time
  # - month_sin
  # - month_cos
  train_years_slice:
  - 2000
  - 2024
  num_validation_years: 5
  # num_data_workers: 0
  # reduce_spatial_mask: False 
  load: True
module:
  type: cvae
  config:
    Architecture:   
      type: MLP
      config:
        encoder_hidden_dims: [3000,3000, 3000, 3000, 3000]
        latent_size: 500
        decoder_hidden_dims: [3000,3000, 3000, 3000, 3000]
        condition_embedding_dims: [3000,3000, 3000, 3000, 3000]
        condition_embedding_size: 2
        condition_dependant_latent: false
        condemb_to_decoder: true
        batch_normalization: false
        dropout_rate: 0
        # init_method: xavier
losspipeline:
  loss_pipeline:
  - name: mse
  reduction: mean
trainer:
  beta_finder:
    beta: 0.1
    num_epoch_to_warmup: 10
  mixed_precision: true
optimization:
  lr: 0.0001
  optimizer_type: adam
  lr_scheduler_config:
    min_lr: 1.0e-06
    warmup_epochs: 5
    hold_min_lr: true
weights:
  spatial_method: uniform
log_every_n_epochs: 2
save_checkpoint: true
seed: 10