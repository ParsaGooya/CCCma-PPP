[project]
authors = [
    {name = "Parsa Gooya", email = "parsa.gooya@ec.gc.ca"},
    {name = "Nic Annau", email = "nicolaas.annau@ec.gc.ca"}
]
dependencies = [
    "xarray>=2026.4.0,<2027",
    "dacite>=1.9.2,<2",
    "hydra-core>=1.3.2,<2",
    "omegaconf>=2.3.0,<3",
    "torch",
    "joblib>=1.5.3",
    "matplotlib>=3.10.9",
    "timm>=1.0.27",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "seaborn>=0.13.2",
]
name = "cccma-ppp"
dynamic = ["version"]
requires-python = ">= 3.11"

[tool.pytest.ini_options]
markers = [
    "pruned: redundant tests removed from optimized suite",
]

filterwarnings = [
    "ignore:Importing from timm.models.layers is deprecated:FutureWarning"
]

[build-system]
requires = [
    "hatchling",
    "hatch-vcs",
]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["cccma_ppp",]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
cccma_ppp = { path = ".", editable = true }

[tool.pixi.tasks]
