experiment_dir: /space/hall7/sitestore/eccc/crd/cccma/users/rna002/output/cccma_PPP_tests/test8
max_epochs: 1
train_loader:
  dataset_config:
    model:
      paths: /space/hall7/sitestore/eccc/crd/cccma/users/rpg002/data/tas/forecast_data/datetime
      names:
        - tas
      preprocessing_pipeline:
        preprocessors_list:
          - name: anomalies
            args:
              dims:
                - time
      ensemble_mean: true
      concat_dim: time
      rename_dict:
        year: time
    condition_method: ensemble_mean
    lead_times:
      start: 1
      end: 12
  batch_size: 2
  time_features:
    - lead_time
    - month_sin
    - month_cos
  train_years_slice:
    - 1980
    - 1981
  num_validation_years: 0
  num_data_workers: 0
  reduce_spatial_mask: true
  load: false
module:
  type: deterministic
  config:
    ModelConfig:
      type: UNet
      config:
        channels:
          - 16
          - 32
          - 64
          - 128
          - 256
        block_config:
          name: convnext
          num_blocks: 2
        output_block_hidden_channels: 32
losspipeline:
  loss_pipeline:
    - name: mse
  reduction: mean
trainer:
  earlystoppingbuffer: 10
  mixed_precision: true
optimization:
  lr: 0.0001
  optimizer_type: adam
  lr_scheduler_config:
    min_lr: 1.0e-05
    warmup_epochs: 1
    total_epochs: 10
    hold_min_lr: true
weights:
  spatial_method: uniform
log_every_n_epochs: 2
save_checkpoint: true
seed: 10
