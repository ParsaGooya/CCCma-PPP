experiment_dir: /space/hall7/sitestore/eccc/crd/cccma/users/rna002/output/cccma_PPP_tests/test9
max_epochs: 1
train_loader:
  dataset_config:
    model:
      paths: /space/hall7/sitestore/eccc/crd/cccma/users/rpg002/data/tas/forecast_data/datetime
      names:
        - tas
      preprocessing_pipeline:
        preprocessors_list:
          - name: anomalies
            args:
              dims:
                - time
          - name: flattener
      ensemble_mean: false
      concat_dim: time
      rename_dict:
        year: time
    observation:
      paths: /space/hall7/sitestore/eccc/crd/cccma/users/rpg002/data/tas/observations/ERA5/datetime
      names:
        - tas
      preprocessing_pipeline:
        preprocessors_list:
          - name: anomalies
            args:
              dims:
                - time
              frequency: month
          - name: flattener
      concat_dim: time
    condition_method: static
    lead_times:
      start: 1
      end: 120
    condition:
      paths: /space/hall7/sitestore/eccc/crd/cccma/users/rpg002/data/tas/dummy_mask
      names:
        - tas

      concat_dim: time

  batch_size: 2
  time_features:
    - time
    - lead_time
    - month_sin
    - month_cos
  train_years_slice:
    - 1980
    - 2007
  num_validation_years: 0
  num_data_workers: 0
  reduce_spatial_mask: true
  load: false
module:
  type: cvae
  config:
    ModelConfig:
      type: MLP
      config:
        encoder_hidden_dims:
          - 8
          - 8
          - 8
        latent_size: 10
        decoder_hidden_dims:
          - 8
          - 8
          - 8
        condition_embedding_dims:
          - 8
          - 8
          - 8
        condition_embedding_size: 10
        condition_dependant_latent: false
        condemb_to_decoder: true
        batch_normalization: true
        dropout_rate: 0.5
        init_method: xavier
losspipeline:
  loss_pipeline:
    - name: mse
  reduction: mean
trainer:
  beta_finder:
    beta: 10
    num_epoch_to_warmup: 10
  earlystoppingbuffer: 10
  mixed_precision: true
optimization:
  lr: 0.0001
  optimizer_type: adam
  lr_scheduler_config:
    min_lr: 1.0e-05
    warmup_epochs: 1
    total_epochs: 10
    hold_min_lr: true
weights:
  spatial_method: uniform
log_every_n_epochs: 2
save_checkpoint: true
seed: 10
